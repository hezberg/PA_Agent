[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-agent"
version = "0.1.0"
description = "Price Action AI assistant: MT5 kline data, two-stage LLM analysis (AGPL-3.0)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "PA Agent Team" }]
dependencies = [
    "numpy>=1.26",
    # easy-tdx 依赖 pandas<3，保持 2.x 线
    "pandas>=2.2,<3",
    "openai>=1.40",
    "tiktoken>=0.7",
    "jsonschema>=4.22",
    "pydantic>=2.7",
    "MetaTrader5>=5.0; sys_platform == 'win32'",
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git",
    "cryptography>=42",
    "pywin32>=306; sys_platform == 'win32'",
    "akshare>=1.14",
    "baostock>=0.8",
    "curl_cffi>=0.13",
    "tushare>=1.4",
    "cursor-sdk>=0.1.0",
    "httpx[socks]>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
    # easy-tdx 已从 PyPI 注册表下架（simple index 404），钉住原 wheel 直链保持可解析；
    # 文件仍由 files.pythonhosted.org 提供。升级需作者重新上架后改回 "easy-tdx>=1.32,<2"。
    "easy-tdx @ https://files.pythonhosted.org/packages/d3/c0/1eff2749bcacd44ac2fabcca414e1c86e367e58d10a133c3a0c723dd0155/easy_tdx-1.32.4-py3-none-any.whl",
    # vendored ths-favorite（同花顺自选）所需
    "protobuf>=5",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.5",
    "black>=24.4",
]

[project.scripts]
pa-agent = "pa_agent.main:main"

[tool.setuptools.packages.find]
include = ["pa_agent*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: unit-level tests",
    "property: property-based tests (hypothesis)",
    "integration: integration tests crossing module boundaries",
    "e2e: end-to-end smoke tests",
    "live: requires real API key via environment variable (never uses config/settings.json)",
]
